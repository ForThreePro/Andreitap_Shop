<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AndreitaP Ventas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <img src="logo2.png" alt="Logo Izquierda">
    <div class="logo-center">
        <img src="logo.png" alt="Logo Central">
    </div>
    <img src="logo1.png" alt="Logo Derecha">
</div>

<h1>✨ AndreitaP Ventas ✨</h1>

<!-- SELECTOR DE PAIS -->
<div class="selector-pais">
    <label>Ver precios en: </label>
    <select id="selectorPais" onchange="cambiarPais()">
        <option value="mx">🇲🇽 México MXN</option>
        <option value="co">🇨🇴 Colombia COP</option>
        <option value="pe">🇵🇪 Perú PEN</option>
        <option value="diam">💎 Diamantes</option>
    </select>
</div>

<!-- SECCION 1: CALIGRAFICOS Y BOTS -->
<div class="seccion">
    <div class="seccion-titulo">💌 SECCION 1: CALIGRÁFICOS Y BOTS 💌</div>
    <div id="productosCaligraficos"></div>
</div>

<!-- SECCION 2: STREAMING Y OTROS -->
<div class="seccion">
    <div class="seccion-titulo">🎬 SECCION 2: STREAMING Y SUSCRIPCIONES 🎬</div>
    <div class="stream-grid" id="streamGrid"></div>
    
    <div class="subtitulo" style="margin-top:20px;">📂 DOCUMENTOS</div>
    <div id="documentos"></div>
    
    <div class="subtitulo">💎 RECARGAS Y PAQUETES</div>
    <div id="recargas"></div>
</div>

<!-- SECCION 3: INFO Y PAGO -->
<div class="seccion">
    <div class="seccion-titulo">☁️ SECCION 3: INFORMACIÓN ☁️</div>
    <div style="text-align:center; font-size:1.2rem; margin:20px 0;">
        💗☁️ ¡Gracias por tu preferencia! ☁️💗
    </div>
    <div class="subtitulo">METODOS DE PAGO</div>
    <div class="metodos" id="metodosPago"></div>
</div>

<button class="btn-wpp" onclick="contactarWPP()">📲 Pedir por WhatsApp</button>

<script src="script.js"></script>
</body>
</html>
